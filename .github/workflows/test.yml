name: App checks
on: [push, pull_request, workflow_call]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: evidence
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: evidence
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U evidence"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://evidence:test-password@127.0.0.1:5432/evidence
      APP_SECRET: ci-only-not-for-production-1234567890123456789
      PLAYWRIGHT_CHANNEL: chromium
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run build
      - run: npm run test:production
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
